name: Build and publish container image

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - "v*"
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image
        if: always()
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          VERSION: ${{ steps.meta.outputs.version }}
          LABELS: ${{ steps.meta.outputs.labels }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
          BUILD_CONTEXT: ./src
          DOCKERFILE: ./src/Dockerfile
        run: |
          {
            echo '## Container image'
            echo
            printf -- '- **Image:** `%s`\n' "$IMAGE"
            printf -- '- **Version:** `%s`\n' "$VERSION"
            printf -- '- **Event:** `%s`\n' "$EVENT_NAME"
            printf -- '- **Ref:** `%s`\n' "$REF"
            printf -- '- **Commit:** `%s`\n' "$SHA"
            printf -- '- **Build context:** `%s`\n' "$BUILD_CONTEXT"
            printf -- '- **Dockerfile:** `%s`\n' "$DOCKERFILE"
            printf -- '- **Build status:** `%s`\n' "$BUILD_STATUS"
            if [ -n "$IMAGE_ID" ]; then printf -- '- **Image ID:** `%s`\n' "$IMAGE_ID"; fi
            if [ -n "$DIGEST" ]; then printf -- '- **Digest:** `%s`\n' "$DIGEST"; fi
            if [ "$PUSHED" = 'true' ]; then echo '- **Registry:** published to GitHub Container Registry'; else echo '- **Registry:** pull requests build the image without publishing'; fi
            echo
            echo '### Generated tags'
            if [ -n "$TAGS" ]; then
              while IFS= read -r tag; do [ -n "$tag" ] && printf -- '- `%s`\n' "$tag"; done <<< "$TAGS"
            else
              echo '_No registry tags generated for this event._'
            fi
            echo
            echo '### OCI labels'
            if [ -n "$LABELS" ]; then
              while IFS= read -r label; do [ -n "$label" ] && printf -- '- `%s`\n' "$label"; done <<< "$LABELS"
            else
              echo '_No OCI labels were generated._'
            fi
            echo
            echo '### Pull and run'
            echo 'Public GHCR packages can be pulled anonymously. For a private package, authenticate first with a classic PAT that has read:packages permission (see the optional login commands below).'
            echo
            echo '#### Bash / Linux / macOS'
            echo '```bash'
            if [ "$PUSHED" = 'true' ] && [ -n "$TAGS" ]; then
              first_tag=$(printf '%s\n' "$TAGS" | head -n 1)
              first_tag_repo=${first_tag%:*}
              first_tag_value=${first_tag##*:}
              printf 'IMAGE_TAG=%s\n' "$first_tag_value"
              printf 'IMAGE="%s:$IMAGE_TAG"\n' "$first_tag_repo"
              echo 'CONTAINER_NAME="k8s-visualizer-$IMAGE_TAG"'
              echo 'KUBECONFIG_HOST_PATH="$HOME/.kube/config-docker"'
              echo 'docker pull "$IMAGE"'
              echo 'docker run -d --name "$CONTAINER_NAME" -p 5080:8080 -e KUBECONFIG=/run/kubeconfig/config --mount "type=bind,source=$KUBECONFIG_HOST_PATH,target=/run/kubeconfig/config,readonly" -v visualizer-data:/app/App_Data "$IMAGE"'
              echo 'docker logs -f "$CONTAINER_NAME"  # follow logs'
              echo 'docker stop "$CONTAINER_NAME"     # stop container'
            else
              echo 'This workflow run does not publish an image.'
            fi
            echo '```'
            if [ "$PUSHED" = 'true' ] && [ -n "$TAGS" ]; then
              echo
              echo '#### Windows PowerShell'
              echo '```powershell'
              printf "\$imageTag = '%s'\n" "$first_tag_value"
              printf '$image = "%s:$imageTag"\n' "$first_tag_repo"
              echo '$containerName = "k8s-visualizer-$imageTag"'
              echo "\$kubeconfig = Join-Path \$env:USERPROFILE '.kube\\config-docker'"
              echo 'docker pull $image'
              echo 'docker run -d --name $containerName -p 5080:8080 `'
              echo '  -e KUBECONFIG=/run/kubeconfig/config `'
              echo '  --mount "type=bind,source=$kubeconfig,target=/run/kubeconfig/config,readonly" `'
              echo '  -v visualizer-data:/app/App_Data `'
              echo '  $image'
              echo 'docker logs -f $containerName'
              echo 'docker stop $containerName'
              echo '```'
              echo
              echo '#### Optional login for a private GHCR package'
              echo 'Authenticate before running the pull command above. For Bash, use a classic PAT with read:packages:'
              echo '```bash'
              echo "read -r -p 'GitHub username: ' GHCR_USER"
              echo "read -r -s -p 'GHCR token (classic, read:packages): ' GHCR_TOKEN; printf '\\n'"
              echo 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin'
              echo 'unset GHCR_TOKEN'
              echo '```'
              echo 'For PowerShell:'
              echo '```powershell'
              echo "\$user = Read-Host 'GitHub username'"
              echo "\$secureToken = Read-Host 'GHCR token (classic, read:packages)' -AsSecureString"
              echo "\$token = [System.Net.NetworkCredential]::new('', \$secureToken).Password"
              echo '$token | docker login ghcr.io -u $user --password-stdin'
              echo '$token = $null; $secureToken = $null'
              echo '```'
              echo 'The kubeconfig path before the colon is on the host; `/run/kubeconfig/config` is the path inside the container. Set that container path in the app connection profile.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
