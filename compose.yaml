services:
  kubernetesvisualizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubernetesvisualizer:local
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      KUBECONFIG: /home/app/.kube/config
      ConnectionProfiles__DatabasePath: /app/App_Data/kubernetes-visualizer.db
    volumes:
      - visualizer-data:/app/App_Data
      - type: bind
        source: ${KUBECONFIG_HOST_PATH:?Set KUBECONFIG_HOST_PATH to your kubeconfig}
        target: /home/app/.kube/config
        read_only: true

volumes:
  visualizer-data:
